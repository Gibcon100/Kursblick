<title>Kursblick Terminal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
/* Layout: terminal grid — toolbar on top, chart stack in the middle, watchlist left, company panel right (stacks on phones) */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --line:#dde2e8; --fg:#18202a; --muted:#5d6b7a;
  --accent:#2962c9; --up:#0f9d74; --down:#d4473b; --chip:#e9eef5;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1319; --panel:#151c24; --line:#26313d; --fg:#dbe3ec; --muted:#8696a8;
  --accent:#5b8ff0; --up:#26b98d; --down:#ef5a4e; --chip:#1e2832; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1319; --panel:#151c24; --line:#26313d; --fg:#dbe3ec; --muted:#8696a8;
  --accent:#5b8ff0; --up:#26b98d; --down:#ef5a4e; --chip:#1e2832; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;box-sizing:border-box}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 320px;grid-template-rows:auto minmax(0,1fr);gap:10px;height:100%;min-height:560px}
.bar{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.brand{font-weight:600;letter-spacing:.02em;margin-right:6px}
.brand span{color:var(--accent)}
.search{position:relative;flex:0 1 240px;min-width:140px}
.search input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
.results{position:absolute;top:calc(100% + 4px);left:0;width:min(360px,80vw);background:var(--panel);border:1px solid var(--line);border-radius:6px;z-index:20;max-height:320px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.results button{display:grid;grid-template-columns:70px 1fr auto;gap:8px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 10px}
.results button:hover,.results button:focus-visible{background:var(--chip)}
.results .sym{font-family:var(--f-num);font-weight:500}
.results .ex{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{background:none;border:0;padding:5px 7px;font-family:var(--f-num);font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg)}
.tbtn{background:none;border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--muted)}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.ind{position:relative}
.ind-menu{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;z-index:20;display:grid;gap:2px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.ind-menu label{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:4px;cursor:pointer}
.ind-menu label:hover{background:var(--chip)}
.ind-menu{max-height:70vh;overflow:auto;min-width:260px}
.params{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;padding:0 6px 8px 30px;font-size:12px;color:var(--muted)}
.params label{display:grid;gap:2px;padding:0;cursor:default}
.params label:hover{background:none}
.params input,.params select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:2px 4px;font-family:var(--f-num);font-size:12px}
.params label.chk{display:flex;align-items:center;gap:6px}
.params input[type=checkbox]{width:auto}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:4px}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.tpl{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:12.5px;color:var(--fg);max-width:150px}
.mode{margin-left:auto;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--up)} .dot.demo{background:#d99a1e}

.side{background:var(--panel);border:1px solid var(--line);border-radius:6px;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.side h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0;padding:10px 12px 6px}
.wl{list-style:none;margin:0;padding:0;overflow:auto}
.wl li{display:flex;align-items:center;border-top:1px solid var(--line)}
.wl button.go{flex:1;text-align:left;background:none;border:0;padding:8px 12px;font-family:var(--f-num)}
.wl li.on button.go{color:var(--accent);font-weight:500}
.wl button.rm{background:none;border:0;color:var(--muted);padding:8px 10px}
.wl-hint{font-size:12px;color:var(--muted);padding:8px 12px}
.al-h{border-top:1px solid var(--line)}
#wl{flex:1 1 auto;min-height:80px}
.wl-bar{display:flex;gap:6px;padding:8px 8px 6px;position:relative}
.wl-bar select{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 6px;font-size:13px}
.wl-menu{position:absolute;top:calc(100% - 2px);right:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px;z-index:20;display:grid;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.wl-menu button{background:none;border:0;text-align:left;padding:7px 10px;border-radius:4px;font-size:13px}
.wl-menu button:hover,.wl-menu button:focus-visible{background:var(--chip)}
.wl-menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.wl-cols,#wl button.go{display:grid;grid-template-columns:minmax(0,1fr) 66px 56px;gap:6px;align-items:baseline}
.wl-cols{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:2px 34px 4px 12px}
.wl-cols span+span,.wl .px,.wl .pc{text-align:right}
.wl .sy{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wl .px,.wl .pc{font-variant-numeric:tabular-nums;font-size:12.5px}
.wl .pc.up{color:var(--up)} .wl .pc.down{color:var(--down)}
#wl li.sec button.go{display:block;font-family:var(--f-ui);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:9px 12px 5px;background:var(--bg)}
.wl li.sec{background:var(--bg)}
dialog.dlg{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:0;width:min(520px,calc(100vw - 32px));box-shadow:0 16px 48px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(0,0,0,.45)}
.dlg form{display:grid;gap:10px;padding:16px}
.dlg h3{margin:0;font-size:15px}
.dlg p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.dlg input[type=text],.dlg textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:7px 8px;font-family:var(--f-num);font-size:12.5px}
.dlg textarea{min-height:150px;resize:vertical}
.dlg .chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}
.dlg .lst{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:4px;padding:4px 8px}
.dlg menu{display:flex;justify-content:flex-end;gap:8px;margin:4px 0 0;padding:0}
.dlg menu button{border:1px solid var(--line);background:none;border-radius:4px;padding:6px 14px}
.dlg menu button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
#alerts{flex:0 0 auto;max-height:40%}
#alerts li{font-family:var(--f-num);font-size:12.5px}
#alerts .go{display:flex;justify-content:space-between;gap:8px}
#alerts li.hit .go{color:#e0a020}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;z-index:50;max-width:min(360px,calc(100vw - 32px))}
.toast{background:var(--panel);border:1px solid #e0a020;border-left-width:4px;border-radius:6px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.25);display:flex;gap:10px;align-items:flex-start}
.toast p{margin:0;line-height:1.4;flex:1}
.toast button{background:none;border:0;color:var(--muted);font-size:16px;line-height:1}
.txtin{position:absolute;z-index:6;font:12px var(--f-ui);background:var(--panel);color:var(--fg);border:1px solid var(--accent);border-radius:3px;padding:3px 6px;width:180px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.head{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;padding:10px 14px;border-bottom:1px solid var(--line)}
.head .t{font-family:var(--f-num);font-size:18px;font-weight:500;background:none;border:0;padding:0;text-decoration:underline dotted var(--muted);text-underline-offset:4px}
.head .n{color:var(--muted)}
.head .px{font-family:var(--f-num);font-size:18px;font-variant-numeric:tabular-nums}
.chg{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}
.ohlc{font-family:var(--f-num);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:100%}
.charts{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
#c-main{flex:1;min-height:260px}
.pane{height:150px;border-top:1px solid var(--line);position:relative}
.pane .lbl,.legend{position:absolute;left:8px;top:4px;z-index:3;font-family:var(--f-num);font-size:11.5px;color:var(--muted);pointer-events:none}
.legend{display:flex;flex-wrap:wrap;gap:2px 12px;max-width:calc(100% - 80px)}
.msg{position:absolute;inset:0;display:grid;place-items:center;z-index:4;background:color-mix(in srgb,var(--panel) 82%,transparent);text-align:center;padding:20px}
.msg p{max-width:46ch;margin:0;line-height:1.5}

.info{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:auto;min-height:0}
.info section{padding:12px 14px;border-bottom:1px solid var(--line)}
.info h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.info .co{font-size:16px;font-weight:600;margin:0 0 2px;text-wrap:balance}
.info .sub{color:var(--muted);font-size:12.5px}
.info p.desc{line-height:1.55;margin:8px 0 0;font-size:13px}
.kv{display:grid;grid-template-columns:1fr auto;gap:5px 10px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right}
.range{height:4px;background:var(--chip);border-radius:2px;position:relative;margin:6px 0 2px}
.range i{position:absolute;top:-3px;width:2px;height:10px;background:var(--fg)}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.err{color:var(--down);font-size:12.5px}
a{color:var(--accent)}

@media (max-width:1000px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:auto;height:auto}
  .side{order:3;max-height:220px}
  .main{order:1;height:78vh;min-height:480px}
  .info{order:2}
  .mode{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand">Kurs<span>blick</span></div>
    <div class="search">
      <input id="q" type="search" placeholder="Ticker oder Name suchen…" autocomplete="off" aria-label="Wertpapier suchen">
      <div class="results" id="results" hidden></div>
    </div>
    <div class="seg" id="tf" role="group" aria-label="Zeitrahmen">
      <button data-i="15min">15m</button><button data-i="30min">30m</button><button data-i="1h">1h</button><button data-i="4h">4h</button>
      <button data-i="1day" aria-pressed="true">1T</button><button data-i="1week">1W</button><button data-i="1month">1M</button>
    </div>
    <select class="tpl" id="tpl" aria-label="Layout-Vorlage" title="Layout-Vorlage: Indikatoren, Einstellungen und Zeitrahmen"></select>
    <div class="ind">
      <button class="tbtn" id="indBtn" aria-expanded="false">Indikatoren</button>
      <div class="ind-menu" id="indMenu" hidden></div>
    </div>
    <div class="seg" role="group" aria-label="Zeichenwerkzeuge">
      <button id="dCursor" aria-pressed="true" title="Zeiger">Zeiger</button>
      <button id="dH" title="Horizontale Linie: einmal in den Chart klicken">Linie</button>
      <button id="dT" title="Trendlinie: zwei Punkte anklicken">Trend</button>
      <button id="dF" title="Fibonacci: Start- und Endpunkt anklicken">Fib</button>
      <button id="dR" title="Rechteck: zwei Ecken anklicken">Box</button>
      <button id="dX" title="Text: Stelle anklicken, Text eingeben, Enter">Text</button>
      <button id="dA" title="Preisalarm: Preis im Chart anklicken">Alarm</button>
    </div>
    <button class="tbtn" id="dUndo" title="Letzte Zeichnung entfernen" aria-label="Letzte Zeichnung entfernen">↶</button>
    <button class="tbtn" id="dClear" title="Alle Zeichnungen dieses Werts löschen">Löschen</button>
    <button class="tbtn" id="wlAdd" title="Zur Watchlist hinzufügen">+ Liste</button>
    <div class="mode"><span class="dot" id="dot"></span><span id="modeTxt">Verbinde…</span></div>
  </header>

  <aside class="side" aria-label="Watchlist">
    <div class="wl-bar">
      <select id="wlSel" aria-label="Watchlist wählen"></select>
      <button class="tbtn" id="wlMenuBtn" aria-expanded="false" aria-label="Listen verwalten" title="Listen verwalten">⋯</button>
      <div class="wl-menu" id="wlMenu" hidden>
        <button data-a="new">Neue Liste…</button><button data-a="ren">Liste umbenennen…</button><button data-a="sec">Abschnitt hinzufügen…</button>
        <hr><button data-a="tv">Aus TradingView importieren…</button><button data-a="ibk">IBKR-Watchlists importieren…</button><button data-a="exp">Als TradingView-Liste exportieren…</button>
        <hr><button data-a="del">Liste löschen…</button>
      </div>
    </div>
    <div class="wl-cols" aria-hidden="true"><span>Symbol</span><span>Kurs</span><span>%</span></div>
    <ul class="wl" id="wl"></ul>
      <h2 class="al-h">Alarme</h2>
    <ul class="wl" id="alerts"></ul>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <main class="main">
    <div class="head">
      <button class="t" id="hSym" title="Firmeninfo anzeigen">AAPL</button>
      <span class="n" id="hName"></span>
      <span class="px" id="hPx"></span>
      <span class="chg" id="hChg"></span>
      <div class="ohlc" id="hOhlc"></div>
    </div>
    <div class="charts">
      <div id="c-main" style="position:relative"><div class="legend" id="legend"></div></div>
      <div class="pane" id="p-rsi" hidden><div class="lbl" id="l-rsi">RSI 14</div></div>
      <div class="pane" id="p-macd" hidden><div class="lbl" id="l-macd">MACD 12 26 9</div></div>
      <div class="pane" id="p-stoch" hidden><div class="lbl" id="l-stoch">Stoch 14 3</div></div>
      <div class="pane" id="p-sqz" hidden><div class="lbl" id="l-sqz">SQZMOM_LB</div></div>
      <div class="pane" id="p-cmmacd" hidden><div class="lbl" id="l-cmmacd">CM_Ult_MacD_MTF</div></div>
      <div class="pane" id="p-atr" hidden><div class="lbl" id="l-atr">ATR 14</div></div>
      <div class="pane" id="p-adx" hidden><div class="lbl" id="l-adx">ADX / DMI 14</div></div>
      <div class="pane" id="p-obv" hidden><div class="lbl" id="l-obv">OBV</div></div>
      <div class="msg" id="msg" hidden><p id="msgTxt"></p></div>
      <input class="txtin" id="txtin" type="text" placeholder="Text eingeben, Enter" hidden aria-label="Text für den Chart">
    </div>
  </main>

  <aside class="info" id="info" aria-label="Firmeninformationen">
    <section><p class="note">Klicke auf den Tickernamen über dem Chart, um die Firmendaten zu laden.</p></section>
  </aside>
</div>

<dialog class="dlg" id="dlg"><form method="dialog" id="dlgF"><h3 id="dlgT"></h3><div id="dlgB" style="display:grid;gap:8px"></div>
  <menu><button value="cancel" type="submit" formnovalidate>Abbrechen</button><button value="ok" class="pri" id="dlgOk" type="submit">OK</button></menu></form></dialog>

<script>
(() => {
const LWC = window.LightweightCharts;
const TD = "Twelve Data", IB = "Interactive Brokers";
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store = {
  get(k, d){ try{ const v = localStorage.getItem("kb:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("kb:"+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- State ---------- */
let mcp = null, live = false;
let cur = store.get("cur", {symbol:"AAPL", mic:"XNGS", name:"Apple Inc."});
if(!store.get("layoutV3", false)){ store.set("interval","30min"); store.set("ind",["bb","cmma","sqz","cmmacd"]); store.set("cur",{symbol:"QQQ",mic:"",name:"Nasdaq-100 (ETF statt NDX)"}); store.set("params",{}); store.set("ownV1",true); store.set("layoutV3",true);
  cur = store.get("cur", cur); }
let interval = store.get("interval", "30min");
let bars = [];
let tool = "cursor", pending = null;
const IND = [
  {id:"sma20", name:"SMA 20", color:"#e3a21a", pane:"main"},
  {id:"sma50", name:"SMA 50", color:"#2a9df4", pane:"main"},
  {id:"sma200", name:"SMA 200", color:"#b05cd6", pane:"main"},
  {id:"ema21", name:"EMA 21", color:"#16a8a0", pane:"main"},
  {id:"vwap", name:"VWAP (Sitzung)", color:"#e0679a", pane:"main"},
  {id:"vol", name:"Volumen", color:"#7b8794", pane:"main"},
  {id:"rsi", name:"RSI 14", color:"#8a63d2", pane:"rsi"},
  {id:"macd", name:"MACD 12 26 9", color:"#2a9df4", pane:"macd"},
  {id:"stoch", name:"Stochastik 14 3", color:"#e3a21a", pane:"stoch"},
  {id:"st", name:"SuperTrend", color:"#00c853", pane:"main"},
  {id:"ichi", name:"Ichimoku Kinko Hyo", color:"#2962ff", pane:"main"},
  {id:"kc", name:"Keltner-Kanal", color:"#26a69a", pane:"main"},
  {id:"dc", name:"Donchian-Kanal", color:"#2196f3", pane:"main"},
  {id:"atr", name:"ATR (Average True Range)", color:"#b05cd6", pane:"atr"},
  {id:"adx", name:"ADX / DMI", color:"#ff9800", pane:"adx"},
  {id:"obv", name:"OBV (On-Balance Volume)", color:"#2a9df4", pane:"obv"},
  {id:"bb", name:"BB (Bollinger Bänder)", color:"#2962ff", pane:"main", own:true},
  {id:"cmma", name:"CM_Ultimate_MA_MTF_V2", color:"#00e676", pane:"main", own:true},
  {id:"cmmacd", name:"CM_Ult_MacD_MTF", color:"#00e676", pane:"cmmacd", own:true},
  {id:"sqz", name:"SQZMOM_LB (Squeeze Momentum)", color:"#7cb342", pane:"sqz", own:true},
];
const PANES = ["rsi","macd","stoch","cmmacd","sqz","atr","adx","obv"];
/* Settings for your own indicators; defaults = your TradingView inputs */
const PDEF = {
  st: [{k:"len",label:"ATR-Länge",v:10},{k:"mult",label:"Faktor",v:3}],
  ichi: [{k:"t",label:"Tenkan",v:9},{k:"k",label:"Kijun",v:26},{k:"s",label:"Senkou B",v:52},{k:"d",label:"Verschiebung",v:26}],
  kc: [{k:"len",label:"EMA-Länge",v:20},{k:"mult",label:"Faktor",v:2},{k:"atr",label:"ATR-Länge",v:10}],
  dc: [{k:"len",label:"Länge",v:20}],
  atr: [{k:"len",label:"Länge",v:14}],
  adx: [{k:"len",label:"Länge",v:14}],

/* ---------- Indicator math ---------- */
const sma = (a,n) => a.map((_,i) => { if(i<n-1) return null; let s=0; for(let j=i-n+1;j<=i;j++) s+=a[j]; return s/n; });
const ema = (a,n) => { const k=2/(n+1); let p=null; return a.map((v,i)=>{ if(v==null) return null; if(p==null){ if(i<n-1) return null; p=a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n; return p;} p=v*k+p*(1-k); return p; }); };
const stdev = (a,n) => a.map((_,i)=>{ if(i<n-1) return null; const s=a.slice(i-n+1,i+1); const m=s.reduce((x,y)=>x+y,0)/n; return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/n); });
function rsi(c,n=14){ const out=Array(c.length).fill(null); let g=0,l=0; for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1]; const up=Math.max(d,0), dn=Math.max(-d,0);
  if(i<=n){ g+=up; l+=dn; if(i===n){ g/=n; l/=n; out[i]=l===0?100:100-100/(1+g/l);} }
  else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; out[i]=l===0?100:100-100/(1+g/l);} } return out; }
function macd(c){ const f=ema(c,12), s=ema(c,26); const m=c.map((_,i)=>f[i]!=null&&s[i]!=null?f[i]-s[i]:null);

function stoch(h,l,c,n=14,d=3){ const k=c.map((v,i)=>{ if(i<n-1) return null; const hh=Math.max(...h.slice(i-n+1,i+1)), ll=Math.min(...l.slice(i-n+1,i+1)); return hh===ll?50:(v-ll)/(hh-ll)*100; });
  const first=k.findIndex(v=>v!=null); const dd=Array(c.length).fill(null); if(first>=0) sma(k.slice(first),d).forEach((v,i)=>dd[first+i]=v); return {k,d:dd}; }
/* MA helpers that tolerate leading gaps */
const lead = (a, fn) => { const f=a.findIndex(v=>v!=null); const out=Array(a.length).fill(null); if(f<0) return out; fn(a.slice(f)).forEach((v,i)=>out[f+i]=v); return out; };
const wma = (a,n) => a.map((_,i)=>{ if(i<n-1) return null; let s=0,w=0; for(let j=0;j<n;j++){ const v=a[i-n+1+j]; if(v==null) return null; s+=v*(j+1); w+=j+1; } return s/w; });
const rma = (a,n) => { let p=null; return a.map((v,i)=>{ if(i<n-1) return null; if(p==null){ p=a.slice(0,n).reduce((x,y)=>x+y,0)/n; return p; } p=(p*(n-1)+v)/n; return p; }); };

    case "5": { const cv=sma(c.map((x,i)=>x*v[i]),n), vv=sma(v,n); return cv.map((x,i)=>x==null||!vv[i]?null:x/vv[i]); }

/* CM_Ult_MacD_MTF (ChrisMoody): EMA fast/slow, signal = SMA of MACD */
function cmMacd(c,f,sl,n){ const a=ema(c,f), b=ema(c,sl); const m=c.map((_,i)=>a[i]!=null&&b[i]!=null?a[i]-b[i]:null);

function linreg(y,n){ return y.map((_,i)=>{ if(i<n-1) return null; let sx=0,sy=0,sxy=0,sxx=0;

/* SQZMOM_LB (LazyBear). Like the original script, the BB width uses the KC multiplier, so results match TradingView. */
function sqzmom(h,l,c,p){

    const ub=basis[i]+dev[i], lb=basis[i]-dev[i], uk=ma[i]+rma[i]*p.kcMult, lk=ma[i]-rma[i]*p.kcMult;
    return (lb>lk&&ub<uk) ? "on" : (lb<lk&&ub>uk) ? "off" : "none"; });
  const src=c.map((v,i)=>{ if(i<p.kcLen-1||ma[i]==null) return null; const hh=Math.max(...h.slice(i-p.kcLen+1,i+1)), ll=Math.min(...l.slice(i-p.kcLen+1,i+1)); return v-((hh+ll)/2+ma[i])/2; });

function trueRange(h,l,c){ return h.map((x,i)=>i===0?x-l[i]:Math.max(x-l[i],Math.abs(x-c[i-1]),Math.abs(l[i]-c[i-1]))); }
function rmaN(a,n){ let p=null, cnt=0, s=0; return a.map(v=>{ if(v==null) return null; if(p==null){ s+=v; cnt++; if(cnt<n) return null; p=s/n; return p; } p=(p*(n-1)+v)/n; return p; }); }
const atrOf=(h,l,c,n)=>rmaN(trueRange(h,l,c),n);
function supertrend(h,l,c,n,m){ const a=atrOf(h,l,c,n); const out=[], dir=[]; let up=null, dn=null, d=1;
  for(let i=0;i<c.length;i++){ if(a[i]==null){ out.push(null); dir.push(null); continue; } const hl=(h[i]+l[i])/2; let bu=hl-m*a[i], bd=hl+m*a[i];
    if(up!=null&&c[i-1]>up) bu=Math.max(bu,up); if(dn!=null&&c[i-1]<dn) bd=Math.min(bd,dn);
    if(up!=null){ if(d===-1&&c[i]>dn) d=1; else if(d===1&&c[i]<up) d=-1; }
    up=bu; dn=bd; out.push(d===1?up:dn); dir.push(d); }
  return {v:out,dir}; }
const midHL=(h,l,n,i)=>{ if(i<n-1) return null; let hh=-Infinity,ll=Infinity; for(let j=i-n+1;j<=i;j++){ if(h[j]>hh) hh=h[j]; if(l[j]<ll) ll=l[j]; } return (hh+ll)/2; };
function ichimoku(h,l,c,q){ const t=c.map((_,i)=>midHL(h,l,q.t,i)), k=c.map((_,i)=>midHL(h,l,q.k,i)), b=c.map((_,i)=>midHL(h,l,q.s,i));
  const a=t.map((v,i)=>v==null||k[i]==null?null:(v+k[i])/2); const sh=(arr,d)=>arr.map((_,i)=>i-d>=0&&i-d<arr.length?arr[i-d]:null);

function dmi(h,l,c,n){ const pd=[0],md=[0]; for(let i=1;i<c.length;i++){ const u=h[i]-h[i-1], d=l[i-1]-l[i]; pd.push(u>d&&u>0?u:0); md.push(d>u&&d>0?d:0); }

  const pdi=p.map((v,i)=>v==null||!tr[i]?null:100*v/tr[i]), mdi=m.map((v,i)=>v==null||!tr[i]?null:100*v/tr[i]);
  const dx=pdi.map((v,i)=>v==null||mdi[i]==null||v+mdi[i]===0?null:100*Math.abs(v-mdi[i])/(v+mdi[i]));

function obvOf(b){ let o=0; return b.map((x,i)=>{ if(i>0){ if(x.close>b[i-1].close) o+=x.volume||0; else if(x.close<b[i-1].close) o-=x.volume||0; } return o; }); }

    if(!self.chart) return; const ts=self.chart.timeScale(), y=p=>self.series.priceToCoordinate(p), x=t=>ts.timeToCoordinate(t);

function parsePayload(p){
  let r = p && typeof p==="object" && "result" in p ? p.result : p;
  if(typeof r!=="string") return r;
  const t=r.trim();
  if(t.startsWith("{")||t.startsWith("[")){ try{ return JSON.parse(t); }catch(e){} }
  const rows=t.split("\n").filter(Boolean); if(rows.length<1) return [];
  if(!rows[0].includes(";")) throw {code:"tool_error", message:t.split("\n")[0]};
  const head=rows[0].split(";");
  return rows.slice(1).map(r=>{ const c=r.split(";"); const o={}; head.forEach((h,i)=>o[h]=c[i]); return o; });
}
async function td(tool, input, staleMs=60000){
  const args = Object.fromEntries(Object.entries(input).filter(([,v])=>v!==""&&v!=null));
  try{ const res = await mcp.callTool(TD, tool, args, {cache:{staleTime:staleMs,gcTime:Math.max(staleMs,300000)}});
    return parsePayload(res.payload); }catch(e){ if(e&&typeof e==="object"&&!e.server) e.server=TD; throw e; }
}
async function ib(tool, input, staleMs=60000){
  let res; try{ res = await mcp.callTool(IB, tool, input, {cache:{staleTime:staleMs,gcTime:Math.max(staleMs,300000)}}); }
  catch(e){ if(e&&typeof e==="object") e.server=IB; throw e; }
  let pl = res.payload; if(typeof pl==="string"){ try{ pl=JSON.parse(pl); }catch(e){ throw {code:"tool_error",server:IB,message:pl}; } }
  return pl;
}

const rollDate = () => ymd(new Date(Date.now()+3*86400000));
async function ibContract(s){
  if(s.src!=="ib"&&s.conid) return {conid:+s.conid, ex:s.ex||"SMART", sec:s.sec||"STK"};
  const base=s.base||s.symbol, sec=s.sec||"STK", k=base+"|"+sec, cache=store.get("ibc",{});
  let r = s.conid ? {conid:s.conid, ex:s.ex} : s.root ? {conid:s.root, ex:s.ex} : cache[k];
  if(r&&r.fail&&Date.now()-r.fail<86400000) throw {code:"tool_error",server:IB,message:"Kein IBKR-Kontrakt für "+base+"."};
  if(!r||r.fail){
    const res=await ib("search_contracts",{query:s.q||base},86400000), rows=(res&&res.results)||[];
    const c=rows.filter(x=>x.symbol===(s.ibSym||base)&&(x.sections||[]).some(z=>z.security_type===sec));
    const pick=c.find(x=>s.ex&&x.exchange===s.ex)||c.find(x=>x.country_code==="US")||c[0];
    if(!pick){ cache[k]={fail:Date.now()}; store.set("ibc",cache); throw {code:"tool_error",server:IB,message:"Kein IBKR-Kontrakt für "+base+" gefunden."}; }
    r={conid:pick.underlying_contract_id, ex:pick.exchange}; cache[k]=r; store.set("ibc",cache);
  }
  if(sec!=="FUT") return {conid:r.conid, ex:sec==="STK"?"SMART":r.ex, sec};
  const fk="fm:"+r.conid; let fm=store.get(fk,null);
  if(fm&&fm.ltd>rollDate()) return fm;
  const fr=await ib("search_futures",{underlying_contract_id:r.conid},3600000);
  const list=((fr&&fr.contracts)||[]).filter(x=>x.last_trading_date>rollDate()).sort((a,b)=>a.last_trading_date.localeCompare(b.last_trading_date));
  if(!list.length) throw {code:"tool_error",server:IB,message:"Kein aktiver Kontrakt für "+base+"."};
  fm={conid:list[0].contract_id, ex:list[0].exchange, sec:"FUT", ltd:list[0].last_trading_date, month:list[0].contract_month}; store.set(fk,fm); return fm;
}
const IBSTEP = {"15min":"FIFTEEN_MINS","30min":"THIRTY_MINS","1h":"ONE_HOUR","4h":"FOUR_HOURS","1day":"ONE_DAY","1week":"ONE_WEEK","1month":"ONE_MONTH"};
let ibInfo = {};
async function ibBars(s, iv, count, staleMs){
  const c=await ibContract(s);
  const r=await ib("get_price_history",{contract_id:c.conid,security_type:c.sec,step:IBSTEP[iv],step_count:Math.min(count,1000),outside_rth:c.sec!=="STK",exchange:c.ex},staleMs);
  if(!r||!Array.isArray(r.time)) throw {code:"tool_error",server:IB,message:"Keine Kursdaten von IBKR."};
  ibInfo={key:kOf(s), delayed:r.delayed, month:c.month, ex:c.ex, sec:c.sec, conid:c.conid};
  const b=r.time.map((t,i)=>({time:Math.floor(Date.parse(t)/1000),open:+r.open[i],high:+r.high[i],low:+r.low[i],close:+r.close[i],volume:r.volume?+r.volume[i]||0:0}))
    .filter(x=>!isNaN(x.time)&&!isNaN(x.close)).sort((x,y)=>x.time-y.time);
  return b.filter((x,i)=>i===0||x.time!==b[i-1].time);
}
const snapRead = o => { if(!o) return null; const last=o.last&&o.last.price, ch=o.change||{}, pc=o["prior-close"]&&o["prior-close"].priorClose;
  if(last==null) return null; let d=ch.change, pp=ch.change_pct; if(d==null&&pc){ d=last-pc; pp=(last/pc-1)*100; } return {px:last, chg:d, pct:pp}; };
async function quoteOf(s){
  if(s.src==="ib"){ const c=await ibContract(s); const r=await ib("get_price_snapshot",{contract_id:c.conid,exchange:c.ex,market_data_names:["last","change","prior_close"]},20000);
    return snapRead(r); }
  const q=(await td("get_quote",{symbol:s.symbol,mic_code:s.mic},30000))[0]; if(!q) return null;
  return {px:+q.close, chg:+q.change, pct:+q.percent_change, cur:q.currency, name:q.name, exch:q.exchange};
}
async function fetchBars(s, iv, count, staleMs){
  if(s.src==="ib") return ibBars(s, iv, count, staleMs);
  return rowsToBars(await td("get_time_series",{symbol:s.symbol,mic_code:s.mic,interval:iv,outputsize:count},staleMs));
}
const toTime = s => Math.floor(Date.parse(String(s).replace(" ","T")+(String(s).length<=10?"T00:00:00Z":"Z"))/1000);

function demoBars(){
  let seed=42; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const out=[]; let p=180; const day=86400; let t=Math.floor(Date.UTC(2025,5,2)/1000);
  while(out.length<340){ const d=new Date(t*1000).getUTCDay(); if(d!==0&&d!==6){ const o=p; const ch=(rnd()-.48)*p*.025; const c=o+ch;
    out.push({time:t,open:o,high:Math.max(o,c)+rnd()*p*.01,low:Math.min(o,c)-rnd()*p*.01,close:c,volume:Math.round(3e7+rnd()*4e7)}); p=c; } t+=day; }
  return out;
}

function rowsToBars(rows){

    .filter(x=>!isNaN(x.time)&&!isNaN(x.close)).sort((x,y)=>x.time-y.time);
  return b.filter((x,i)=>i===0||x.time!==b[i-1].time); }

/* Maps a watchlist entry to something IBKR can price: indices/futures directly, stocks by ticker, metals, crypto, FX */
const CRYPTO = new Set(["BTC","ETH","SOL","XRP","LTC","BCH","ADA","DOGE","AVAX","LINK","DOT","UNI","SHIB"]);
function ibKeyOf(w){
  if(w.src==="ib") return w;
  if(w.conid) return {symbol:w.symbol, conid:+w.conid, ex:w.ex||"SMART", sec:w.sec||"STK"};
  if(w.mic&&!["XNYS","XNAS","XNGS","XNMS","ARCX","BATS","XASE",""].includes(w.mic)) return null;
  const m=/^([A-Z0-9]{2,6})\/([A-Z]{3})$/.exec(w.symbol);
  if(m){ if(/^X(AU|AG|PT|PD)$/.test(m[1])) return {base:m[1]+m[2], sec:"CMDTY", symbol:w.symbol};
    if(CRYPTO.has(m[1])) return {base:m[1], sec:"CRYPTO", symbol:w.symbol};
    return {base:m[1], sec:"CASH", ibSym:m[1]+"."+m[2], q:m[1]+"."+m[2], symbol:w.symbol}; }
  if(!/^[A-Z][A-Z.\-]{0,6}$/.test(w.symbol)) return null;
  return {base:w.symbol.replace("."," "), q:w.symbol.replace("."," "), sec:"STK", symbol:w.symbol};
}
let pricing=false;
async function updatePrices(){
  if(!live||pricing||document.hidden) return; pricing=true;
  try{
    const items=L().items.filter(x=>!x.section).slice(0,100), ready=[]; let resolves=0;
    for(const w of items){ const k=ibKeyOf(w); if(!k) continue;
      const known = k.conid || k.root || (store.get("ibc",{})[(k.base||k.symbol)+"|"+(k.sec||"STK")]);
      if(!known){ if(resolves>=4) continue; resolves++; }
      try{ const c=await ibContract(k); ready.push([kOf(w), c.conid+"@"+c.ex]); }catch(e){ if(e&&e.code&&e.code!=="tool_error") throw e; } }
    for(let i=0;i<ready.length;i+=33){ const part=ready.slice(i,i+33);
      const r=await ib("get_price_snapshot",{contract_id_exs:[...new Set(part.map(x=>x[1]))],market_data_names:["last","change","prior_close"]},20000);
      part.forEach(([k,id])=>{ const q=snapRead(r&&r[id]); if(q) priceCache[k]={...q,t:Date.now()}; }); }
    paintPrices();
    if(resolves>=4) setTimeout(updatePrices, 4000);
  }catch(e){ /* IBKR not connected: list stays without prices */ }
  finally{ pricing=false; }
}

/* Small modal dialog without browser prompts */
function dialog(title, bodyHtml, okText, onOk){

/* TradingView list text: "###Abschnitt,NASDAQ:AAPL,TVC:NDX,…" (export file) or one symbol per line */
const TV_IDX = {NDX:"NDX",NAS100:"NDX",US100:"NDX",USTEC:"NDX",NQ100:"NDX",IXIC:"NDX",SPX:"SPX",SPX500:"SPX",US500:"SPX",SPXUSD:"SPX",DJI:"INDU",US30:"INDU",DJ30:"INDU",WS30:"INDU",RUT:"RUT",US2000:"RUT",RUSSELL2000:"RUT",VIX:"VIX"};
const TV_FUT = {USOIL:"CL",WTI:"CL",XTIUSD:"CL",WTICOUSD:"CL",USOUSD:"CL",CL:"CL",NATGAS:"NG",XNGUSD:"NG",NGAS:"NG"};
function tvMap(tok){
  const t=tok.trim(); if(!t) return null; const [ex,raw]=t.includes(":")?t.split(":"):["",t]; const S=raw.toUpperCase().replace(/\s+/g,"");
  if(TV_IDX[S]) return symOf(ibPreset(TV_IDX[S]));
  let m=/^([A-Z]{1,3})\d!$/.exec(S); if(m&&ibPreset(m[1]+"1!")) return symOf(ibPreset(m[1]+"1!"));
  if(TV_FUT[S]) return symOf(ibPreset(TV_FUT[S]+"1!"));
  const MET={GOLD:"XAU",SILVER:"XAG",PLATINUM:"XPT",PALLADIUM:"XPD"}; if(MET[S]) return {symbol:MET[S]+"/USD",mic:"",name:t};
  m=/^(XAU|XAG|XPT|XPD)(USD)$/.exec(S); if(m) return {symbol:m[1]+"/USD",mic:"",name:t};
  m=/^([A-Z]{2,5})(USDT|USDC|USD|EUR)$/.exec(S); if(m&&CRYPTO.has(m[1])) return {symbol:m[1]+"/"+(m[2]==="EUR"?"EUR":"USD"),mic:"",name:t};
  m=/^(EUR|USD|GBP|JPY|CHF|AUD|CAD|NZD|TRY|SEK|NOK|PLN|MXN|CNH|HKD|SGD|ZAR)(EUR|USD|GBP|JPY|CHF|AUD|CAD|NZD|TRY|SEK|NOK|PLN|MXN|CNH|HKD|SGD|ZAR)$/.exec(S); if(m) return {symbol:m[1]+"/"+m[2],mic:"",name:t};
  const MIC={XETR:"XETR",FWB:"XFRA",LSE:"XLON",EURONEXT:"XPAR",SIX:"XSWX",TSX:"XTSE"}; return {symbol:S,mic:MIC[ex.toUpperCase()]||"",name:t};
}
function tvParse(text){ const out=[]; text.split(/[\n,]+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{ if(tok.startsWith("###")){ const n=tok.replace(/^#+/,"").trim(); if(n) out.push({section:n}); } else { const s=tvMap(tok); if(s&&!out.some(o=>!o.section&&sameSym(o,s))) out.push(s); } }); return out; }
function tvExport(items){
  const IDX={NDX:"NASDAQ:NDX",SPX:"SP:SPX",INDU:"TVC:DJI",RUT:"TVC:RUT",VIX:"TVC:VIX"}, FX={COMEX:"COMEX",NYMEX:"NYMEX",CME:"CME",CBOT:"CBOT"};
  return items.map(w=>{ if(w.section) return "###"+w.section;
    if(w.src==="ib") return w.sec==="FUT" ? (FX[w.ex]||"CME")+":"+w.base+"1!" : (IDX[w.symbol]||w.symbol);
    const m=/^([A-Z0-9]+)\/([A-Z]+)$/.exec(w.symbol); if(m) return (/^X(AU|AG|PT|PD)$/.test(m[1])?"OANDA:":CRYPTO.has(m[1])?"COINBASE:":"FX:")+m[1]+m[2];
    const MX={XETR:"XETR",XFRA:"FWB",XLON:"LSE",XPAR:"EURONEXT",XSWX:"SIX",XTSE:"TSX"}; return (MX[w.mic]?MX[w.mic]+":":"")+w.symbol; }).join(","); }

const wlActions = {
  new(){ dialog("Neue Liste",`<input type="text" id="dNm" placeholder="Name der Liste" maxlength="60">`,"Anlegen",b=>{ const n=b.querySelector("#dNm").value.trim(); if(!n) return;
    const l={id:"l"+Date.now().toString(36),name:n,items:[]}; lists.push(l); curList=l.id; saveLists(); renderWatch(); }); },
  ren(){ dialog("Liste umbenennen",`<input type="text" id="dNm" maxlength="60" value="${esc(L().name)}">`,"Speichern",b=>{ const n=b.querySelector("#dNm").value.trim(); if(n){ L().name=n; saveLists(); renderWatch(); } }); },
  sec(){ dialog("Abschnitt hinzufügen",`<p>Der Abschnitt kommt ans Ende der Liste, so wie „###“-Abschnitte in TradingView.</p><input type="text" id="dNm" placeholder="z. B. Indizes" maxlength="40">`,"Hinzufügen",b=>{ const n=b.querySelector("#dNm").value.trim(); if(n){ L().items.push({section:n}); saveLists(); renderWatch(); } }); },
  del(){ dialog("Liste löschen",`<p>„${esc(L().name)}“ mit ${L().items.filter(x=>!x.section).length} Werten wird aus diesem Browser gelöscht.</p>`,"Löschen",()=>{ lists=lists.filter(l=>l.id!==L().id);
    if(!lists.length) lists=[{id:"l"+Date.now().toString(36),name:"Meine Liste",items:[]}]; curList=lists[0].id; saveLists(); renderWatch(); updatePrices(); }); },
  tv(){ dialog("Aus TradingView importieren",`<p>In TradingView oben in der Watchlist auf den Listennamen klicken, dann „Liste exportieren“. Die .txt-Datei hier auswählen oder den Inhalt einfügen. Abschnitte (###) bleiben erhalten.</p>
      <input type="file" id="dFile" accept=".txt,text/plain" multiple><textarea id="dTxt" placeholder="###Indizes,TVC:NDX,NASDAQ:QQQ,###Öl,NYMEX:CL1!,AMEX:USO"></textarea>
      <input type="text" id="dNm" placeholder="Name der neuen Liste (leer = Dateiname)" maxlength="60">`,"Importieren",async b=>{
      const files=[...b.querySelector("#dFile").files], txt=b.querySelector("#dTxt").value, nm=b.querySelector("#dNm").value.trim(); let made=0;
      for(const f of files){ const items=tvParse(await f.text()); if(items.length){ lists.push({id:"l"+Date.now().toString(36)+made,name:(files.length===1&&nm)||f.name.replace(/\.txt$/i,""),items}); made++; } }
      if(txt.trim()){ const items=tvParse(txt); if(items.length){ lists.push({id:"l"+Date.now().toString(36)+"t",name:nm||"TradingView-Import",items}); made++; } }
      if(made){ curList=lists[lists.length-1].id; saveLists(); renderWatch(); updatePrices(); } }); },
  async ibk(){ if(!live) return dialog("IBKR-Watchlists","<p>Dafür muss der Interactive-Brokers-Connector verbunden sein.</p>",null);
    dialog("IBKR-Watchlists importieren",`<p class="note">Lade deine Listen …</p>`,"Importieren",async b=>{ const ids=[...b.querySelectorAll("input:checked")].map(x=>x.value);
      for(const id of ids){ try{ const w=await ib("get_watchlist",{id},60000);
        const items=(w.instruments||[]).map(x=>{ const [cid,ex]=String(x.contract_id_ex).split("@"); const d=String(x.contract_description||"").trim();
          return /^[A-Z][A-Z.]{0,6}$/.test(d) ? {symbol:d,mic:"",name:d,conid:+cid,...(ex?{ex}:{})} : null; }).filter(Boolean);
        const skipped=(w.instruments||[]).length-items.length;
        lists.push({id:"ib"+id+"-"+Date.now().toString(36),name:(w.name||"IBKR")+" (IBKR)",items}); curList=lists[lists.length-1].id;
        if(skipped) toastInfo(`${skipped} Einträge aus „${w.name}“ sind keine Aktien/ETFs und wurden übersprungen.`);
      }catch(e){ toastInfo(errText(e)); } }
      saveLists(); renderWatch(); updatePrices(); });
    try{ const r=await ib("get_watchlists",{},60000); const seen=new Set();
      const rows=(r.watchlists||[]).filter(w=>{ const k=w.name.trim(); if(seen.has(k)) return false; seen.add(k); return true; });
      $("dlgB").innerHTML=`<p>Wähle die Listen aus deinem IBKR-Konto. Jede wird hier eine eigene Liste.</p><div class="lst">${rows.map(w=>`<label class="chk"><input type="checkbox" value="${esc(w.id)}"> ${esc(w.name)}</label>`).join("")}</div>`;
    }catch(e){ $("dlgB").innerHTML=`<p class="err"></p>`; $("dlgB").firstChild.textContent=errText(e); } },
  exp(){ dialog("Als TradingView-Liste exportieren",`<p>Text kopieren, als .txt speichern und in TradingView über „Liste importieren“ laden.</p><textarea id="dTxt" readonly>${esc(tvExport(L().items))}</textarea>`,null);
    setTimeout(()=>{ const t=$("dlgB").querySelector("textarea"); if(t){ t.focus(); t.select(); } },50); }
};

$("tf").querySelectorAll("button").forEach(b=>{ b.setAttribute("aria-pressed",String(b.dataset.i===interval));
  b.onclick=()=>{ interval=b.dataset.i; store.set("interval",interval); $("tf").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b))); tplTouched(); load(); }; });
function tplTouched(){ if(typeof renderTpl!=="function"||!tplCur) return; tplCur=""; store.set("tplCur",""); renderTpl(); }
IND.forEach((d,ix)=>{ if(d.own&&!IND[ix-1].own){ const g=document.createElement("div"); g.className="grp"; g.textContent="Meine Indikatoren"; $("indMenu").appendChild(g); }
  const l=document.createElement("label"); l.innerHTML=`<input type="checkbox" id="ind-${d.id}"><span class="sw" style="background:${d.color}"></span><span></span>`;
  l.lastChild.textContent=d.name; const cb=l.querySelector("input"); cb.checked=active.has(d.id);
  cb.onchange=()=>{ cb.checked?active.add(d.id):active.delete(d.id); store.set("ind",[...active]); tplTouched(); if(bars.length) renderIndicators(); ensureHtf(); }; $("indMenu").appendChild(l);
  if(PDEF[d.id]){ const box=document.createElement("div"); box.className="params"; const q=P(d.id);
    PDEF[d.id].forEach(f=>{ const w=document.createElement("label"); const id=`par-${d.id}-${f.k}`; let inp;
      if(f.type==="select"){ inp=document.createElement("select"); f.opts.forEach(([v,t])=>{ const o=document.createElement("option"); o.value=v; o.textContent=t; inp.appendChild(o); }); inp.value=q[f.k]; }
      else if(f.type==="bool"){ inp=document.createElement("input"); inp.type="checkbox"; inp.checked=!!q[f.k]; w.className="chk"; }
      else { inp=document.createElement("input"); inp.type="number"; inp.step="any"; inp.min="0"; inp.value=q[f.k]; }
      inp.id=id; const t=document.createElement("span"); t.textContent=f.label;
      if(f.type==="bool") w.append(inp,t); else w.append(t,inp);
      inp.onchange=()=>{ const v = f.type==="bool"?inp.checked : f.type==="select"?inp.value : parseFloat(inp.value);
        if(f.type!=="bool"&&f.type!=="select"&&!(v>0)) { inp.value=P(d.id)[f.k]; return; }
        tplTouched(); params[d.id]={...(params[d.id]||{}),[f.k]:f.k==="mult"||f.k.endsWith("Mult")||f.type==="select"?v:Math.round(v)}; store.set("params",params);
        if(bars.length) renderIndicators(); ensureHtf(); };
      box.appendChild(w); });
    box.addEventListener("click",e=>e.stopPropagation()); $("indMenu").appendChild(box); } });

const TPL_STD = {id:"std", name:"Mein Standard (30m)", ind:["bb","cmma","sqz","cmmacd"], params:{}, interval:"30min", fixed:true};
let tpls = store.get("tpls", [TPL_STD]); if(!tpls.some(t=>t.id==="std")) tpls.unshift(TPL_STD);
let tplCur = store.get("tplCur", "");
function syncMenu(){
  IND.forEach(d=>{ const cb=$("ind-"+d.id); if(cb) cb.checked=active.has(d.id);
    if(PDEF[d.id]){ const q=P(d.id); PDEF[d.id].forEach(f=>{ const el=$(`par-${d.id}-${f.k}`); if(!el) return; if(f.type==="bool") el.checked=!!q[f.k]; else el.value=q[f.k]; }); } });

function renderTpl(){
  const sel=$("tpl"); sel.innerHTML="";
  const add=(v,t,dis)=>{ const o=document.createElement("option"); o.value=v; o.textContent=t; if(dis) o.disabled=true; sel.appendChild(o); };
  add("","Vorlage …",true); tpls.forEach(t=>add(t.id,t.name)); add("_save","＋ Aktuelles Layout speichern…");
  if(tplCur&&!tpls.find(t=>t.id===tplCur)?.fixed) add("_del","× Vorlage löschen…");
  sel.value=tpls.some(t=>t.id===tplCur)?tplCur:"";
}
function applyTpl(t){
  active=new Set(t.ind); params=JSON.parse(JSON.stringify(t.params||{})); interval=t.interval||interval;
  store.set("ind",[...active]); store.set("params",params); store.set("interval",interval);
  tplCur=t.id; store.set("tplCur",tplCur); syncMenu(); renderTpl(); load();
}

    return; }
  if(v==="_del"){ const t=tpls.find(x=>x.id===tplCur); renderTpl(); if(!t) return;
    dialog("Vorlage löschen",`<p>„${esc(t.name)}“ löschen? Die Charts bleiben wie sie sind.</p>`,"Löschen",()=>{ tpls=tpls.filter(x=>x!==t); store.set("tpls",tpls); tplCur=""; store.set("tplCur",""); renderTpl(); }); return; }
  const t=tpls.find(x=>x.id===v); if(t) applyTpl(t);
};

/* ---------- Auto refresh: chart each minute, plus up to 3 other symbols with open alerts ---------- */
let rr=0;
async function refresh(){
  if(!live||document.hidden) return;
  const sym={...cur}, iv=interval;
  try{ const b=await fetchBars(sym, iv, iv==="1month"?240:800, 45000);
    if(sameSym(sym,cur)&&iv===interval&&b.length){ bars=b; paint(true); } }catch(e){}
  loadQuote();
  await updatePrices();
  const others=[...new Map(alerts.filter(a=>!a.hit&&!sameSym(a,cur)).map(a=>[kOf(a),a])).values()];
  for(let k=0;k<Math.min(3,others.length);k++){ const a=others[(rr+k)%others.length];
    const pc=priceCache[kOf(a)]; if(pc&&pc.t&&Date.now()-pc.t<90000){ checkAlerts(a,pc.px,pc.px); continue; }
    try{ const q=await quoteOf(a); if(q) checkAlerts(a, q.px, q.px); }catch(e){} }
  rr+=3;
}
